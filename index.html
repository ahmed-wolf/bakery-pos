<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>تسجيل الدخول | مخبز العائلة</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

<!-- مكتبة الكيبورد التاتش -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/simple-keyboard@latest/build/css/index.css">
<script src="https://cdn.jsdelivr.net/npm/simple-keyboard@latest/build/index.js"></script>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root { --cream: #F6EEDD; --paper: #FFFDF8; --crust: #3D2B1F; --ink: #2B2118; --honey: #C98A3D; --brick: #A8453A; --border: rgba(61,43,31,0.12); }
  body { font-family: 'Tajawal', sans-serif; background: var(--crust); min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; overscroll-behavior: none; }
  .login-card { background: var(--cream); border-radius: 24px; width: 380px; box-shadow: 0 24px 60px rgba(0,0,0,0.35); overflow: hidden; position: relative; z-index: 10; margin-bottom: 20px; }
  .form-input { width: 100%; background: var(--paper); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; font-size: 15px; font-weight: bold; }
  .form-input:focus { outline: 2px solid var(--honey); }
  
  /* ستايل الكيبورد */
  #keyboardWrapper { position: fixed; bottom: 0; left: 0; width: 100%; z-index: 1000; background: #e2e8f0; padding: 10px; box-shadow: 0 -5px 15px rgba(0,0,0,0.3); transition: transform 0.3s ease-in-out; transform: translateY(100%); }
  #keyboardWrapper.show { transform: translateY(0); }
  .simple-keyboard { color: #000; font-weight: bold; }
  
  /* تشفير الباسورد عشان كروم ميتدخلش نهائيا */
  .secure-input { -webkit-text-security: disc; font-family: text-security-disc, 'Tajawal', sans-serif; }
</style>
</head>
<body>
<div class="login-card">
  <div class="px-8 pt-8 pb-6 text-center" style="background: var(--crust); color: var(--cream);">
    <div class="w-14 h-14 mx-auto rounded-2xl flex items-center justify-center text-xl mb-3" style="background: var(--honey);">🥐</div>
    <h1 class="font-display font-bold text-xl">مخبز العائلة</h1>
  </div>
  <form id="loginForm" class="px-8 py-7">
    <label class="block text-xs font-bold mb-2" style="color: var(--ink);">اختر اسم المستخدم</label>
    <select id="loginEmail" class="form-input mb-4 cursor-pointer">
      <option value="">جاري تحميل القائمة...</option>
    </select>

    <label class="block text-xs font-bold mb-2" style="color: var(--ink);">كلمة المرور</label>
    <!-- تم تغيير النوع لـ text مع إخفاء بنظام CSS لمنع Autofill -->
    <input id="loginPassword" type="text" required class="form-input mb-2 secure-input" placeholder="••••" autocomplete="off" spellcheck="false">

    <p id="loginErrorMsg" class="text-xs font-bold mb-2 hidden text-center" style="color: var(--brick);"></p>
    <button type="submit" id="submitBtn" class="w-full py-3.5 rounded-xl font-bold text-sm mt-4 transition-colors" style="background: var(--honey); color: #2A1400;">دخول</button>
  </form>
</div>

<!-- حاوية الكيبورد -->
<div id="keyboardWrapper">
    <div class="flex justify-between mb-2">
        <span class="text-sm font-bold text-gray-700 px-2">لوحة الأرقام (كلمة المرور)</span>
        <button type="button" onclick="closeKeyboard()" class="text-red-500 font-bold text-sm bg-white px-3 py-1 rounded">إغلاق ✕</button>
    </div>
    <div class="simple-keyboard" dir="ltr"></div>
</div>

<script>
const supabaseClient = supabase.createClient("https://rjhsjekwixavydzkghqt.supabase.co", "sb_publishable_lHjuLBBq_tr59ziXYvFSag_UMPkGMkj");

// سحب أسماء الموظفين من الداتابيز
async function loadStaffList() {
  const { data, error } = await supabaseClient.from("staff").select("email, full_name, role");
  const select = document.getElementById("loginEmail");
  
  if (data && data.length > 0) {
    select.innerHTML = '<option value="">-- اضغط لاختيار اسمك --</option>' + data.map(s => `<option value="${s.email}">${s.full_name} (${s.role === 'admin' ? 'مدير' : 'كاشير'})</option>`).join("");
  } else {
    select.innerHTML = `<option value="">لا يوجد موظفين مسجلين حالياً</option>`;
  }
}
loadStaffList();

// === إعدادات الكيبورد التاتش (بالطريقة الصح اللي إنت استنتجتها) ===
let keyboard;
const passwordInput = document.getElementById("loginPassword");
const kbWrapper = document.getElementById("keyboardWrapper");
let passString = ""; // المصدر الوحيد للباسورد

function initKeyboard() {
  keyboard = new window.SimpleKeyboard.default({
    onChange: input => onChange(input),
    onKeyPress: button => onKeyPress(button),
    layout: {
      default: ["1 2 3", "4 5 6", "7 8 9", "{bksp} 0 {enter}"]
    },
    display: {
        '{bksp}': 'مسح ⌫',
        '{enter}': 'تأكيد ↵'
    }
  });
}

// قفلنا الـ onChange خالص عشان نتجنب الـ Buffer الداخلي للمكتبة
function onChange(input) {
    return;
}

// الاعتماد بالكامل على ضغطات الزراير
function onKeyPress(button) {
  if (button === '{bksp}') {
      passString = passString.slice(0, -1);
  } else if (button === '{enter}') {
      closeKeyboard();
      document.getElementById("submitBtn").click(); // تفعيل زرار الدخول
      return;
  } else if (/^[0-9]$/.test(button)) {
      passString += button;
  }
  passwordInput.value = passString;
}

function closeKeyboard() {
    kbWrapper.classList.remove("show");
}

passwordInput.addEventListener("focus", () => {
    kbWrapper.classList.add("show");
    if(!keyboard) initKeyboard();
});

// اللاب توب بيكتب هنا مباشرة وبيحدث نفس المتغير بدون تضارب
passwordInput.addEventListener("keydown", (e) => {
    if (e.key >= '0' && e.key <= '9') {
        e.preventDefault();
        passString += e.key;
        passwordInput.value = passString;
    } else if (e.key === 'Backspace') {
        e.preventDefault();
        passString = passString.slice(0, -1);
        passwordInput.value = passString;
    } else if (e.key === 'Enter') {
        e.preventDefault();
        document.getElementById("submitBtn").click();
    } else if (e.key !== 'Tab') {
        e.preventDefault(); // منع أي حروف تانية
    }
});
// ==============================

// تسجيل الدخول الذكي
document.getElementById("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const email = document.getElementById("loginEmail").value;
  // بناخد الباسورد من المتغير اللي إحنا متحكمين فيه 100% مش من المربع
  const rawPassword = passString; 
  
  if(!email) { alert("من فضلك اختر اسم المستخدم من القائمة!"); return; }
  if(!rawPassword) { alert("من فضلك اكتب كلمة المرور!"); return; }

  const errorMsg = document.getElementById("loginErrorMsg");
  errorMsg.classList.add("hidden");
  
  const btn = document.getElementById("submitBtn");
  btn.disabled = true; btn.textContent = "جاري الدخول...";

  let { data, error } = await supabaseClient.auth.signInWithPassword({ 
    email, 
    password: rawPassword + "-bakery" 
  });
  
  if (error) {
    const fallback = await supabaseClient.auth.signInWithPassword({ 
      email, 
      password: rawPassword 
    });
    data = fallback.data;
    error = fallback.error;
  }
  
  if (error) {
    errorMsg.textContent = "كلمة المرور غير صحيحة!";
    errorMsg.classList.remove("hidden");
    btn.disabled = false; btn.textContent = "دخول";
    
    // تصفير الباسورد عشان يكتب من جديد
    passString = "";
    passwordInput.value = "";
    return;
  }
  
  const { data: staff } = await supabaseClient.from("staff").select("role").eq("id", data.user.id).single();
  if (staff && staff.role === "cashier") {
    window.location.href = "pos_1.html";
  } else {
    window.location.href = "admin_4.html";
  }
});
</script>
</body>
</html>
