<script>
const SUPABASE_URL = "https://rjhsjekwixavydzkghqt.supabase.co";
const SUPABASE_KEY = "sb_publishable_lHjuLBBq_tr59ziXYvFSag_UMPkGMkj";
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
let CURRENT_USER = null; let CURRENT_BRANCH = null; let CURRENT_SHIFT = null;
let products = []; let cart = {};
let subtotal = 0; let total = 0;

let currentMultiplierStr = "";

function appendMultiplier(num) {
  if (currentMultiplierStr.length > 5) return; 
  if (num === '.' && currentMultiplierStr.includes('.')) return; 
  if (num === '.' && currentMultiplierStr === "") {
      currentMultiplierStr = "0";
  }
  currentMultiplierStr += num.toString();
  document.getElementById('multiplierDisplay').textContent = currentMultiplierStr;
}

function clearMultiplier() {
  currentMultiplierStr = "";
  document.getElementById('multiplierDisplay').textContent = "1";
}

function getMultiplier() {
  let val = parseFloat(currentMultiplierStr);
  return (isNaN(val) || val <= 0) ? 1 : val; 
}

// === دالة حاسبة الخصم العافية (النهائية) ===
function calculateAndApplyDiscount(source) {
    let sub = subtotal; 
    let pct = 0;
    let amt = 0;

    const discPctEl = document.getElementById("discountPercent");
    const discAmtEl = document.getElementById("discountAmount");

    if (source === 'pct') {
        pct = parseFloat(discPctEl.value) || 0;
        if (pct > 100) { pct = 100; discPctEl.value = "100"; }
        amt = sub * (pct / 100);
        discAmtEl.value = amt > 0 ? amt.toFixed(2) : "";
    } else if (source === 'amt') {
        amt = parseFloat(discAmtEl.value) || 0;
        if (amt > sub) { amt = sub; discAmtEl.value = sub; }
        pct = sub > 0 ? (amt / sub) * 100 : 0;
        discPctEl.value = pct > 0 ? pct.toFixed(2) : "";
    }

    let finalTotal = sub - amt;
    document.getElementById("subtotalVal").textContent = sub.toFixed(2) + " ج";
    document.getElementById("totalVal").textContent = finalTotal.toFixed(2) + " ج";
    total = finalTotal; 
}

// ربط الحاسبة بكيبورد اللاب توب
document.getElementById("discountPercent").addEventListener("input", () => calculateAndApplyDiscount('pct'));
document.getElementById("discountAmount").addEventListener("input", () => calculateAndApplyDiscount('amt'));


// === إعدادات الكيبورد الذكي ===
let keyboard;
let selectedInputName = "productSearch"; 

const layoutArabic = {
  default: [
    "ذ 1 2 3 4 5 6 7 8 9 0 - {bksp}",
    "ض ص ث ق ف غ ع ه خ ح ج د",
    "ش س ي ب ل ا ت ن م ك ط {enter}",
    "ئ ء ؤ ر لا ى ة و ز ظ .",
    "{space}"
  ]
};

const layoutNumpad = {
  default: ["1 2 3", "4 5 6", "7 8 9", ". 0 {bksp}", "{enter}"]
};

function initKeyboard() {
  keyboard = new window.SimpleKeyboard.default({
    onChange: input => onChange(input),
    onKeyPress: button => onKeyPress(button),
    layout: layoutArabic,
    display: {
        '{bksp}': 'مسح ⌫',
        '{enter}': 'تأكيد ↵',
        '{space}': 'مسافة'
    },
    rtl: true
  });
}

function setKeyboardLayout(inputId) {
    if(!keyboard) return;
    const numpadInputs = ['discountPercent', 'discountAmount', 'startShiftCashInput', 'actualCashInput'];
    if (numpadInputs.includes(inputId)) {
        keyboard.setOptions({ layout: layoutNumpad });
    } else {
        keyboard.setOptions({ layout: layoutArabic });
    }
}

function showKeyboardWithScroll(element) {
    document.getElementById("keyboardWrapper").classList.remove("hidden");
    const modal = element.closest('.modal-overlay');
    if (modal) {
        modal.style.alignItems = 'flex-start';
        modal.style.paddingTop = '30px'; 
    } else {
        document.getElementById("bottomInputsWrapper").style.paddingBottom = "280px";
        setTimeout(() => {
            element.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }, 150);
    }
}

function closeKeyboard() {
    document.getElementById("keyboardWrapper").classList.add("hidden");
    document.getElementById("bottomInputsWrapper").style.paddingBottom = "0px";
    document.querySelectorAll('.modal-overlay').forEach(m => {
        m.style.alignItems = 'center';
        m.style.paddingTop = '0px';
    });
}

let managerPassString = "";

function updateFakeDots(val) {
    const display = document.getElementById("fakeDotsDisplay");
    if (val && val.length > 0) {
        display.textContent = '•'.repeat(val.length);
        display.className = "text-gray-900 text-3xl tracking-[0.3em]"; 
    } else {
        display.textContent = '••••';
        display.className = "text-gray-400 text-lg tracking-normal"; 
    }
}

const managerBox = document.getElementById("managerCodeBox");

managerBox.addEventListener("click", () => {
    managerBox.focus();
});

managerBox.addEventListener("focus", () => {
    selectedInputName = 'managerCodeBox';
    if(!keyboard) initKeyboard();
    keyboard.setOptions({ layout: layoutNumpad });
    showKeyboardWithScroll(managerBox);
});

managerBox.addEventListener("keydown", (e) => {
    if (e.key >= '0' && e.key <= '9') {
        e.preventDefault();
        managerPassString += e.key;
        updateFakeDots(managerPassString);
    } else if (e.key === 'Backspace') {
        e.preventDefault();
        managerPassString = managerPassString.slice(0, -1);
        updateFakeDots(managerPassString);
    } else if (e.key === 'Enter') {
        e.preventDefault();
        executeShiftSales();
    }
});

document.querySelectorAll('.form-input').forEach(input => {
  if (input.id === 'managerCodeBox') return; 

  input.addEventListener("focus", (e) => {
    selectedInputName = e.target.id;
    
    if (e.target.value === "0" || e.target.value === "0.00") {
        e.target.value = "";
    }

    if(!keyboard) initKeyboard();
    setKeyboardLayout(selectedInputName);
    keyboard.setInput(e.target.value);
    showKeyboardWithScroll(e.target);
  });

  input.addEventListener("input", (e) => {
     if (keyboard && selectedInputName === e.target.id) {
         if (keyboard.getInput() !== e.target.value) {
             keyboard.setInput(e.target.value);
         }
     }
  });
});

function onChange(input) {
  if (selectedInputName === 'managerCodeBox') return; 
  
  const el = document.getElementById(selectedInputName);
  if(el) {
      el.value = input;
      
      // إجبار الكيبورد التاتش إنه يحسب الخصم فوراً
      if (selectedInputName === 'discountPercent') {
          calculateAndApplyDiscount('pct');
      } else if (selectedInputName === 'discountAmount') {
          calculateAndApplyDiscount('amt');
      } else {
          el.dispatchEvent(new Event('input', { bubbles: true })); 
      }
  }
}

function onKeyPress(button) {
  if (selectedInputName === 'managerCodeBox') {
      if (button === '{bksp}') {
          managerPassString = managerPassString.slice(0, -1);
      } else if (button === '{enter}') {
          executeShiftSales();
          return;
      } else if (/^[0-9]$/.test(button)) {
          managerPassString += button;
      }
      updateFakeDots(managerPassString);
      return;
  }

  if (button === "{enter}") {
      const el = document.getElementById(selectedInputName);
      if(el && selectedInputName === "productSearch") {
          el.dispatchEvent(new KeyboardEvent('keypress', {key: 'Enter'})); 
      } else if (selectedInputName === "startShiftCashInput") {
          document.getElementById("confirmStartShiftBtn").click();
      } else if (selectedInputName === "actualCashInput") {
          document.getElementById("confirmEndShiftBtn").click();
      }
      closeKeyboard();
  }
}

function closeAdminModal() {

function escapeHtml(str) {
  if (!str) return '';
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

async function loadProducts() {
  const { data } = await supabaseClient.from("products").select("*").eq("is_active", true);
  products = data || [];
  renderProducts();
}

function renderProducts() {
  const grid = document.getElementById("productGrid");
  const search = document.getElementById("productSearch").value.toLowerCase();
  const filtered = products.filter(p => p.name.toLowerCase().includes(search) || (p.barcode && p.barcode.includes(search)));
  
  const cardColors = [
      'bg-blue-100 border-blue-400', 
      'bg-green-100 border-green-400', 
      'bg-yellow-100 border-yellow-400', 
      'bg-pink-100 border-pink-400', 
      'bg-purple-100 border-purple-400',
      'bg-orange-100 border-orange-400'
  ];

  grid.innerHTML = filtered.map((p, index) => {
    const colorScheme = cardColors[index % cardColors.length];
    return `
    <div onclick="addToCart('${p.id}')" class="product-card ${colorScheme} border-2 p-4 rounded-2xl text-center flex flex-col justify-center items-center shadow-md min-h-[110px]">
      <div class="font-extrabold text-xl text-gray-900 mb-2 leading-tight">${escapeHtml(p.name)}</div>
      <div class="text-gray-900 font-extrabold text-lg bg-white bg-opacity-70 rounded-xl py-1 px-4 shadow-sm">${Number(p.base_price).toFixed(2)} ج</div>
    </div>
  `}).join("");
}

document.getElementById("productSearch").addEventListener("input", renderProducts);

document.getElementById("productSearch").addEventListener("keypress", (e) => {
  if (e.key === "Enter") {
    const scanVal = e.target.value.trim();
    if (!scanVal) return;

    if (scanVal.length === 13 && scanVal.startsWith("23")) {
      const itemCode = scanVal.substring(2, 7); 
      const weightInGrams = scanVal.substring(7, 12); 
      const weightInKg = Number(weightInGrams) / 1000; 

      const p = products.find(x => x.barcode === itemCode);
      if (p) {
        if(cart[p.id]) cart[p.id].qty += weightInKg; 
        else cart[p.id] = { ...p, qty: weightInKg };
        
        updateCart(); e.target.value = ""; renderProducts(); 
        clearMultiplier();
        return;
      }
    }

    const normalProduct = products.find(x => x.barcode === scanVal);
    if (normalProduct) {
      addToCart(normalProduct.id); e.target.value = ""; renderProducts();
    } else {
      alert("المنتج ده مش متسجل في السيستم!"); e.target.value = "";
    }
  }
});

function addToCart(id) {
  const p = products.find(x => x.id === id);
  const qtyToAdd = getMultiplier();
  
  if(cart[id]) {
      cart[id].qty += qtyToAdd; 
  } else {
      cart[id] = { ...p, qty: qtyToAdd };
  }
  
  updateCart();
  clearMultiplier();
}

function updateCart() {
  const list = document.getElementById("cartList");
  const entries = Object.values(cart);
  
  list.innerHTML = entries.map(e => `
    <div class="flex justify-between items-center mb-3 bg-white bg-opacity-10 p-3 rounded-lg text-base font-bold">
      <div class="w-1/2 leading-tight">${escapeHtml(e.name)}</div>
      <div class="flex gap-2 items-center">
        <button onclick="cart['${e.id}'].qty--; if(cart['${e.id}'].qty<=0) delete cart['${e.id}']; updateCart();" class="w-8 h-8 flex justify-center items-center bg-red-500 rounded text-white text-xl">-</button>
        <span class="text-lg">${e.qty}</span>
        <button onclick="cart['${e.id}'].qty++; updateCart();" class="w-8 h-8 flex justify-center items-center bg-green-500 rounded text-white text-xl">+</button>
      </div>
      <div class="text-lg text-yellow-300">${(e.base_price * e.qty).toFixed(2)}</div>
    </div>
  `).join("");

  subtotal = entries.reduce((sum, e) => sum + (e.base_price * e.qty), 0);
  
  // تطبيق الخصم فوراً لو تم زيادة أو تقليل منتج
  calculateAndApplyDiscount('pct');
}

function resetCartUI() {
  cart = {}; 
  document.getElementById("customerName").value = ""; 
  document.getElementById("orderNotes").value = "";
  document.getElementById("discountPercent").value = ""; 
  document.getElementById("discountAmount").value = ""; 
  updateCart();
  clearMultiplier();
  
  EDITING_ORDER_ID = null;

  const btn = document.getElementById("checkoutBtn");

}

document.getElementById("checkoutBtn").addEventListener("click", async () => {
  const entries = Object.values(cart);
  if(entries.length === 0) return alert("السلة فاضية!");
  
  const btn = document.getElementById("checkoutBtn");
  btn.disabled = true;
  btn.innerHTML = "جاري الحفظ والطباعة... ⏳";
  btn.className = "w-full py-4 rounded-2xl font-black text-xl text-white mb-2 transition-colors bg-gray-500";

  const custName = document.getElementById("customerName").value || "عميل نقدي";
  const notes = document.getElementById("orderNotes").value;
  const dPct = parseFloat(document.getElementById("discountPercent").value) || 0;
  const dAmt = parseFloat(document.getElementById("discountAmount").value) || 0;
  const receiptNum = EDITING_ORDER_ID ? EDITING_RECEIPT_NUM : `R-${Date.now()}`;

  try {
    let targetOrderId = null;

    if (EDITING_ORDER_ID) {
        const { error: updateError } = await supabaseClient.from("orders").update({
            total_amount: total, customer_name: custName, notes: notes, 
            discount_percentage: dPct, discount_amount: dAmt
        }).eq("id", EDITING_ORDER_ID);
        if(updateError) throw updateError;
        
        targetOrderId = EDITING_ORDER_ID;
        
        await supabaseClient.from("order_items").delete().eq("order_id", targetOrderId);
    } else {
        const { data: order, error } = await supabaseClient.from("orders").insert({
          branch_id: CURRENT_BRANCH, cashier_id: CURRENT_USER.id, receipt_number: receiptNum,
          total_amount: total, customer_name: custName, notes: notes, 
          discount_percentage: dPct, discount_amount: dAmt, payment_method: 'cash'
        }).select().single();
        if(error) throw error;
        
        targetOrderId = order.id;
    }

    const orderItems = entries.map(e => ({
      order_id: targetOrderId, product_id: e.id, quantity: e.qty, unit_price: e.base_price
    }));
    const { error: itemsError } = await supabaseClient.from("order_items").insert(orderItems);
    if(itemsError) throw itemsError;

    printReceipt(receiptNum, entries, custName, notes, dAmt);
    
    resetCartUI();
    closeKeyboard();

  } catch (err) {
    alert("حدث خطأ أثناء الحفظ، يرجى المحاولة تاني!");
    btn.disabled = false;
    btn.innerHTML = EDITING_ORDER_ID ? "حفظ التعديل وطباعة 🖨️" : "تأكيد وطباعة 🖨️";
    btn.className = EDITING_ORDER_ID ? 
        "w-full py-4 rounded-2xl font-black text-xl text-white mb-2 transition-colors bg-indigo-600 hover:bg-indigo-700" : 
        "w-full py-4 rounded-2xl font-black text-xl text-white mb-2 transition-colors bg-green-600 hover:bg-green-700";
  }
});

function openEditOrderModal() {
    document.getElementById('editOrderModal').classList.add("open");
    document.getElementById('searchReceiptInput').value = "";
    document.getElementById('searchReceiptInput').focus();
}

function closeEditOrderModal() {
    document.getElementById('editOrderModal').classList.remove("open");

}

async function searchOrderForEdit() {
    const receiptNum = document.getElementById('searchReceiptInput').value.trim();
    if(!receiptNum) return alert("اكتب رقم الفاتورة الأول!");

    const btn = document.getElementById('searchOrderBtn');
    btn.disabled = true; btn.textContent = "جاري البحث...";

    try {
        const { data: order, error: orderError } = await supabaseClient
            .from("orders")
            .select("*")
            .eq("receipt_number", receiptNum)
            .single();
        
        if(orderError || !order) throw new Error("الفاتورة دي مش موجودة أو الرقم غلط!");

        const { data: items, error: itemsError } = await supabaseClient
            .from("order_items")
            .select("*, products(*)")
            .eq("order_id", order.id);

        if(itemsError) throw itemsError;

        cart = {};
        items.forEach(item => {
            cart[item.product_id] = {
                id: item.product_id,
                name: item.products.name,
                base_price: item.unit_price,
                qty: item.quantity,
                barcode: item.products.barcode
            };
        });

        document.getElementById("customerName").value = order.customer_name === "عميل نقدي" ? "" : (order.customer_name || "");
        document.getElementById("orderNotes").value = order.notes || "";
        document.getElementById("discountPercent").value = order.discount_percentage || "";
        document.getElementById("discountAmount").value = order.discount_amount || "";

        EDITING_ORDER_ID = order.id;
        EDITING_RECEIPT_NUM = order.receipt_number;

        const checkoutBtn = document.getElementById('checkoutBtn');
        checkoutBtn.innerHTML = "حفظ التعديل وطباعة 🖨️";
        checkoutBtn.className = "w-full py-4 rounded-2xl font-black text-xl text-white mb-2 transition-colors bg-indigo-600 hover:bg-indigo-700";

        updateCart();
        closeEditOrderModal();
        alert("تم استرجاع الفاتورة للسلة.. تقدر تعدل براحتك وتدوس حفظ.");

    } catch (err) {
        alert(err.message || "حدث خطأ أثناء البحث");
    } finally {
        btn.disabled = false; btn.textContent = "بحث واسترجاع للسلة";
    }
}

document.getElementById("endShiftBtn").addEventListener("click", () => {

  const shiftTotal = orders.reduce((sum, o) => sum + Number(o.total_amount), 0);

  await supabaseClient.from("cashier_shifts").update({
    status: "closed", closed_at: new Date().toISOString(),
    actual_cash: actualCash, expected_cash: shiftTotal + Number(CURRENT_SHIFT.opening_cash), total_sales: shiftTotal
  }).eq("id", CURRENT_SHIFT.id);

  printZReport(shiftTotal, actualCash, CURRENT_SHIFT.opening_cash);

  setTimeout(async () => {
    await supabaseClient.auth.signOut();
    window.location.href = "index.html";
  }, 2000);
});

function printReceipt(num, items, cust, note, disc) {
  const nameEn = escapeHtml(branchSettings.bakery_name);
  const logoUrl = escapeHtml(branchSettings.logo_url);
  const welcomeMsg = escapeHtml(branchSettings.welcome_message);

  let html = ``;
  if (logoUrl) {
      html += `<img src="${logoUrl}" id="receiptLogo" class="r-logo">`;
  }
  
  html += `<div class="r-title">${nameEn}</div><div class="r-divider"></div>
  <div class="r-row"><span>رقم:</span><span>${escapeHtml(num)}</span></div>`;
  if(cust) html += `<div class="r-row"><span>العميل:</span><span>${escapeHtml(cust)}</span></div>`;
  html += `<div class="r-divider"></div><table><tr><th>الصنف</th><th>سعر</th><th>ك</th><th>ج</th></tr>`;
  
  items.forEach(i => html += `<tr><td>${escapeHtml(i.name)}</td><td>${Number(i.base_price).toFixed(2)}</td><td>${i.qty}</td><td>${(i.base_price*i.qty).toFixed(2)}</td></tr>`);  
  
  html += `</table><div class="r-divider"></div>
  <div class="r-row"><span>الإجمالي الفرعي:</span><span>${subtotal.toFixed(2)}</span></div>`;
  if(disc > 0) html += `<div class="r-row"><span>الخصم:</span><span>-${disc.toFixed(2)}</span></div>`;
  html += `<div class="r-row font-bold"><span>المطلوب:</span><span>${total.toFixed(2)}</span></div>`;
  if(note) html += `<div class="r-divider"></div><div class="text-center text-xs">ملاحظة: ${escapeHtml(note)}</div>`;
  
  html += `<div class="r-divider"></div><div class="text-center font-bold" style="margin-top:5px;">${welcomeMsg}</div>`;
  
  document.getElementById("printArea").innerHTML = html;

  if (logoUrl) {
      let imgElement = document.getElementById("receiptLogo");
      imgElement.onload = function() { window.print(); };
      imgElement.onerror = function() { window.print(); }; 
  } else {
      window.print();
  }
}

function printZReport(sales, actual, opening) {
  const html = `<div class="r-title">تقرير إغلاق الوردية (Z-Report)</div>
  <div class="r-divider"></div>
  <div class="r-row"><span>وقت الفتح:</span><span dir="ltr">${new Date(CURRENT_SHIFT.opened_at).toLocaleString('ar-EG')}</span></div>
  <div class="r-row"><span>وقت الإغلاق:</span><span dir="ltr">${new Date().toLocaleString('ar-EG')}</span></div>
  <div class="r-divider"></div>
  <div class="r-row"><span>العهدة الافتتاحية:</span><span>${Number(opening).toFixed(2)}</span></div>
  <div class="r-row"><span>إجمالي المبيعات:</span><span>${Number(sales).toFixed(2)}</span></div>
  <div class="r-divider"></div>
  <div class="r-row font-bold"><span>المتوقع بالدرج:</span><span>${(Number(sales) + Number(opening)).toFixed(2)}</span></div>
  <div class="r-row font-bold"><span>الفعلي (الجرد):</span><span>${Number(actual).toFixed(2)}</span></div>
  <div class="r-row font-bold"><span>العجز/الزيادة:</span><span>${(Number(actual) - (Number(sales) + Number(opening))).toFixed(2)}</span></div>
  <div class="r-divider"></div><div class="text-center">تم إغلاق الوردية بنجاح</div>`;
  
  document.getElementById("printArea").innerHTML = html;
  window.print();
}

init();
</script>
